name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test mail behavior
        run: swift test

      - name: Validate distribution scripts and cask generation
        run: |
          bash -n scripts/build.sh scripts/package.sh scripts/validate-package.sh
          plutil -lint Resources/Info.plist distribution/Envl.entitlements
          python3 scripts/test-distribution.py

      - name: Build and validate universal local packages
        run: bash scripts/package.sh
